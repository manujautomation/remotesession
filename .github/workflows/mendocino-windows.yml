# Windows build for Remote Session by Mendocino-Apcela.
#
# Flutter cannot cross-compile Windows desktop apps from Linux — the embedder is built
# with MSVC — so this is the only way we get an .exe without maintaining a Windows box.
#
# Adapted from upstream's build-for-windows-flutter job, keeping the parts that matter and
# dropping the optional extras:
#   kept    : custom Flutter engine (x64 texture rendering), the 3.24.5 dropdown patch,
#             vcpkg codecs, flutter_rust_bridge codegen
#   dropped : usbmmidd virtual display, printer driver, hwcodec/vram, arm64
#             — all optional features pulling third-party binaries; add later if wanted.
#
# The artifact is UNPROVISIONED on purpose. Provisioning needs mrc_signing_key.json, which
# must never reach a public repo: with it, anyone could sign a custom.txt redirecting every
# agent in the fleet to their own server. Run client/mrc_provision.py locally instead.

name: windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # Upstream's patched engine for texture rendering on x64.
      #
      # Upstream hardcodes C:/hostedtoolcache/windows/flutter/stable-<ver>-x64/..., which
      # depends on how flutter-action lays out its cache — upstream pins that action to an
      # exact SHA, so the path is stable for them and not for us. Resolve it from the
      # flutter binary instead.
      #
      # continue-on-error because this is an optimisation, not a requirement: the stock
      # engine still produces a working build, and an optional step must not be able to
      # fail the whole job.
      - name: Replace engine with rustdesk custom flutter engine
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          flutter precache --windows
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          DEST="$FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release"
          echo "flutter root: $FLUTTER_ROOT"
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts/engine/" || true
          curl -fsSL -o engine.zip \
            https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
          mkdir -p "$DEST"
          unzip -o engine.zip -d "$DEST"
          ls -la "$DEST" | head

      # Upstream's dropdown-filter patch for 3.24.5. Also best-effort: it only affects a
      # UI affordance, and `git apply` fails outright if the SDK has already been patched
      # or differs even slightly — not a reason to lose the whole build.
      - name: Patch flutter
        continue-on-error: true
        shell: bash
        run: |
          set -eux
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_ROOT"
          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: mendocino-windows

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:/vcpkg
          doNotUpdateVcpkg: true
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static

      # `flutter pub get` MUST run before codegen: the generator shells out to
      # `flutter pub run ffigen`, which needs .dart_tool/package_config.json. Without it
      # the only symptom is "ffigen failed" with empty stdout AND stderr.
      - name: Generate the Dart bridge
        shell: bash
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && flutter pub get && popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      # NOT --skip-portable-pack: that leaves a Release directory, and zipping it would
      # produce a .zip while the in-app updater asks for a .exe (mrc_update::asset_name),
      # so the Windows update would 404. The packer emits a single self-extracting
      # installer, which is what the updater can actually run.
      - name: Build
        run: python3 .\build.py --portable --flutter

      # Version comes from Cargo.toml so it matches crate::VERSION, which is what the
      # updater compares release tags against. If these drift, the update channel
      # silently stops offering anything.
      - name: Rename to the asset name the updater constructs
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          SRC="rustdesk-${VERSION}-install.exe"
          DEST="mendocino-apcela-remote-${VERSION}-x86_64.exe"
          test -f "$SRC" || { echo "expected $SRC from build.py; got:"; ls -la *.exe || true; exit 1; }
          mv "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mendocino-apcela-remote-windows-x86_64
          path: mendocino-apcela-remote-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mendocino-apcela-remote-*.exe
